server {
    listen 80;
    root /usr/share/nginx/html;

    # Interview files up to 5 MB each, several per upload.
    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        # Drafting a script is one model call; on a CPU it can take minutes.
        proxy_read_timeout 600s;
    }

    location / {
        try_files $uri /index.html;
    }
}
